<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Mark Font Test</title>
  <link rel="stylesheet" href="../../assets/company-mark/company-mark.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #e4e4e7;
      color: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      display: grid;
      min-height: 100vh;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    section {
      display: grid;
      min-height: 100vh;
      align-content: center;
      justify-items: center;
      gap: 32px;
      padding: 48px 32px;
    }
    section[data-theme="light"] { background: #fafafa; color: #09090b; }
    section[data-theme="dark"] { background: #09090b; color: #fafafa; }
    h1 { margin: 0; font-size: 18px; }
    .sizes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .sample {
      display: grid;
      justify-items: center;
      gap: 12px;
    }
    .sample span:last-child {
      color: #71717a;
      font-size: 12px;
    }
    [data-theme="dark"] .sample span:last-child { color: #a1a1aa; }
    .mark-96 { font-size: 96px; }
    .mark-56 { font-size: 56px; }
    .mark-32 { font-size: 32px; }
    .mark-20 { font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <section data-theme="light">
      <h1>SVG → WOFF2 · Light</h1>
      <div class="sizes" aria-label="浅色公司标记尺寸对照">
        <div class="sample"><i class="pui-company-mark mark-96" aria-label="公司标记 96px"></i><span>96px</span></div>
        <div class="sample"><i class="pui-company-mark mark-56" aria-label="公司标记 56px"></i><span>56px</span></div>
        <div class="sample"><i class="pui-company-mark mark-32" aria-label="公司标记 32px"></i><span>32px</span></div>
        <div class="sample"><i class="pui-company-mark mark-20" aria-label="公司标记 20px"></i><span>20px</span></div>
      </div>
    </section>
    <section data-theme="dark">
      <h1>SVG → WOFF2 · Dark</h1>
      <div class="sizes" aria-label="深色公司标记尺寸对照">
        <div class="sample"><i class="pui-company-mark mark-96" aria-label="公司标记 96px"></i><span>96px</span></div>
        <div class="sample"><i class="pui-company-mark mark-56" aria-label="公司标记 56px"></i><span>56px</span></div>
        <div class="sample"><i class="pui-company-mark mark-32" aria-label="公司标记 32px"></i><span>32px</span></div>
        <div class="sample"><i class="pui-company-mark mark-20" aria-label="公司标记 20px"></i><span>20px</span></div>
      </div>
    </section>
  </main>
</body>
</html>
