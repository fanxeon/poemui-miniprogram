name: PoemUI Quality Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild package artifacts
        run: npm run site:build

      - name: Run design and component contracts
        run: npm run check

      - name: Verify npm package contents
        run: npm run pack:check
